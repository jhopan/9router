name: CLI Pack

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install root deps
        run: npm install

      - name: Install cli deps
        run: npm --prefix cli install

      - name: Build + pack CLI
        run: npm run cli:pack

      - name: Upload tgz
        uses: actions/upload-artifact@v5
        with:
          name: 9router-cli
          path: 9router-*.tgz
