name: CLI Pack

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root deps
        run: npm install

      - name: Build + pack CLI
        run: npm run cli:pack

      - name: Upload tgz
        uses: actions/upload-artifact@v4
        with:
          name: 9router-cli
          path: 9router-*.tgz
