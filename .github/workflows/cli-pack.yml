name: CLI Pack

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install root deps
        run: npm install

      - name: Install cli deps
        run: npm --prefix cli install

      - name: Build + pack CLI
        run: npm run cli:pack

      - name: Locate tgz
        run: |
          find .. -maxdepth 1 -name "9router-*.tgz" -exec mv {} . \;
          cp 9router-*.tgz 9router.tgz
          ls -la *.tgz

      - name: Upload tgz
        uses: actions/upload-artifact@v5
        with:
          name: 9router-cli
          path: ./*.tgz

      - name: Publish 9router.tgz to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The README install command points at
          # .../releases/latest/download/9router.tgz, so the release tagged
          # "latest" must always carry a 9router.tgz asset. Replace any
          # stale asset (including the old 9router-release.tgz name) so the
          # README URL resolves to this build.
          gh release upload latest 9router.tgz --clobber --repo "$GITHUB_REPOSITORY"
          # Also ship the versioned tarball alongside, for pinning.
          gh release upload latest 9router-*.tgz --clobber --repo "$GITHUB_REPOSITORY"
          # Drop the legacy asset name if it exists from a prior manual upload.
          gh release view latest --json assets --jq '.assets[].name' | grep -q '^9router-release.tgz$' \
            && gh release delete-asset latest 9router-release.tgz --yes --repo "$GITHUB_REPOSITORY" || true
